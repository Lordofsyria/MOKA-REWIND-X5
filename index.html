<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LORDS OF SYRIA — Google Drive Sync</title>

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
  </script>

  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121821;
      --line: #263244;
      --gold: #ffd56a;
      --muted: #9aa6b7;
      --green: #3ddc97;
      --blue: #4285f4;
      --red: #ff6868;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #e8eef7;
      font-family: system-ui, Tahoma, Arial, sans-serif;
      background:
        radial-gradient(900px 500px at 10% -10%, #1a2433, var(--bg) 65%);
    }

    header {
      text-align: center;
      padding: 32px 16px 20px;
    }

    h1 {
      margin: 0;
      color: var(--gold);
      font-size: clamp(28px, 6vw, 48px);
      letter-spacing: 2px;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
    }

    .container {
      width: min(940px, calc(100% - 32px));
      margin: 0 auto;
      padding-bottom: 36px;
    }

    .panel {
      margin-top: 16px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, #121821, #0e131b);
      box-shadow: 0 14px 35px rgba(0, 0, 0, .35);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--red);
    }

    .dot.ok {
      background: var(--green);
      box-shadow: 0 0 12px rgba(61, 220, 151, .7);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: #e8eef7;
      background: #1b2533;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .google {
      color: white;
      border-color: #2a56c6;
      background: linear-gradient(180deg, #4285f4, #3367d6);
    }

    .save {
      color: #241900;
      border-color: #c99600;
      background: linear-gradient(180deg, #f5c542, #ffb700);
    }

    .load {
      color: #032417;
      border-color: #1f8a62;
      background: linear-gradient(180deg, #6ff0c2, #3ddc97);
    }

    textarea {
      width: 100%;
      min-height: 230px;
      margin-top: 14px;
      padding: 12px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: #e8eef7;
      background: #0b1119;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      direction: ltr;
    }

    .note {
      margin-top: 14px;
      padding: 12px;
      border: 1px solid #35445b;
      border-radius: 12px;
      color: #cdd6e4;
      line-height: 1.7;
      background: #171f2d;
    }

    .error {
      margin-top: 14px;
      padding: 12px;
      border: 1px solid #8f3333;
      border-radius: 12px;
      color: #ffd0d0;
      background: #351717;
      display: none;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <header>
    <h1>👑 LORDS OF SYRIA</h1>
    <div class="subtitle">ربط نظيف مع Google Drive</div>
  </header>

  <main class="container">
    <section class="panel">
      <div class="status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">غير متصل بـ Google Drive</span>
      </div>

      <div class="actions">
        <button id="loginButton" class="google">
          تسجيل دخول Google
        </button>

        <button id="loadButton" class="load" disabled>
          تحميل من Drive
        </button>

        <button id="saveButton" class="save" disabled>
          حفظ إلى Drive
        </button>

        <button id="logoutButton" disabled>
          تسجيل الخروج
        </button>
      </div>

      <textarea id="dataBox">{
  "clans": [],
  "players": [],
  "rewards": []
}</textarea>

      <div class="note">
        هذا اختبار للمزامنة فقط. بعد نجاح الحفظ والتحميل سنعيد إدخال نفس الربط داخل برنامج الكلانات الكامل.
      </div>

      <div id="errorBox" class="error"></div>
    </section>
  </main>

  <script>
    const CLIENT_ID =
      '670203375895-d76mtp1bjcmqp6emjinh5oint494d433.apps.googleusercontent.com';

    const SCOPE =
      'https://www.googleapis.com/auth/drive.file';

    const FILE_NAME =
      'lords_of_syria_data.json';

    let tokenClient;
    let accessToken = '';
    let driveFileId = '';

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const loginButton = document.getElementById('loginButton');
    const loadButton = document.getElementById('loadButton');
    const saveButton = document.getElementById('saveButton');
    const logoutButton = document.getElementById('logoutButton');
    const dataBox = document.getElementById('dataBox');
    const errorBox = document.getElementById('errorBox');

    function showError(error) {
      const message =
        error?.error?.message ||
        error?.message ||
        String(error);

      errorBox.textContent = message;
      errorBox.style.display = 'block';

      console.error(error);
    }

    function clearError() {
      errorBox.textContent = '';
      errorBox.style.display = 'none';
    }

    function setConnected() {
      statusDot.classList.add('ok');
      statusText.textContent = 'متصل بـ Google Drive';

      loadButton.disabled = false;
      saveButton.disabled = false;
      logoutButton.disabled = false;
    }

    function setDisconnected() {
      statusDot.classList.remove('ok');
      statusText.textContent = 'غير متصل بـ Google Drive';

      loadButton.disabled = true;
      saveButton.disabled = true;
      logoutButton.disabled = true;
    }

    function validateJson() {
      try {
        return JSON.parse(dataBox.value);
      } catch (error) {
        throw new Error('البيانات داخل المربع ليست JSON صالحًا.');
      }
    }

    function initializeGoogle() {
      if (
        !CLIENT_ID ||
        CLIENT_ID === 'ضع_CLIENT_ID_الجديد_هنا'
      ) {
        showError(
          'ضع Client ID الحقيقي داخل const CLIENT_ID أولًا.'
        );
        return;
      }

      if (!window.google?.accounts?.oauth2) {
        showError(
          'مكتبة Google لم تُحمّل بعد. حدّث الصفحة ثم أعد المحاولة.'
        );
        return;
      }

      tokenClient =
        google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPE,

          callback: async (response) => {
            if (response.error) {
              showError(response);
              return;
            }

            clearError();

            accessToken = response.access_token;

            setConnected();

            await findExistingFile();
          }
        });
    }

    function login() {
      clearError();

      if (!tokenClient) {
        initializeGoogle();
      }

      if (!tokenClient) {
        return;
      }

      tokenClient.requestAccessToken({
        prompt: 'consent'
      });
    }

    async function findExistingFile() {
      try {
        const response = await fetch(
          'https://www.googleapis.com/drive/v3/files?' +
          new URLSearchParams({
            q: `name='${FILE_NAME}' and trashed=false`,
            spaces: 'drive',
            fields: 'files(id,name,modifiedTime)'
          }),
          {
            headers: {
              Authorization: `Bearer ${accessToken}`
            }
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw result;
        }

        if (result.files?.length) {
          driveFileId = result.files[0].id;

          statusText.textContent =
            'متصل — تم العثور على ملف البيانات';
        } else {
          statusText.textContent =
            'متصل — لا يوجد ملف بعد، استخدم حفظ إلى Drive';
        }
      } catch (error) {
        showError(error);
      }
    }

    async function saveToDrive() {
      try {
        clearError();

        const jsonData = validateJson();

        const metadata = {
          name: FILE_NAME,
          mimeType: 'application/json'
        };

        const form = new FormData();

        form.append(
          'metadata',
          new Blob(
            [JSON.stringify(metadata)],
            { type: 'application/json' }
          )
        );

        form.append(
          'file',
          new Blob(
            [JSON.stringify(jsonData, null, 2)],
            { type: 'application/json' }
          )
        );

        const url = driveFileId
          ? `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart`
          : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';

        const response = await fetch(url, {
          method: driveFileId ? 'PATCH' : 'POST',
          headers: {
            Authorization: `Bearer ${accessToken}`
          },
          body: form
        });

        const result = await response.json();

        if (!response.ok) {
          throw result;
        }

        driveFileId = result.id;

        statusText.textContent =
          'تم الحفظ في Google Drive بنجاح';
      } catch (error) {
        showError(error);
      }
    }

    async function loadFromDrive() {
      try {
        clearError();

        if (!driveFileId) {
          await findExistingFile();
        }

        if (!driveFileId) {
          throw new Error(
            'لا يوجد ملف بيانات بعد. أضف بيانات ثم اضغط حفظ إلى Drive.'
          );
        }

        const response = await fetch(
          `https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,
          {
            headers: {
              Authorization: `Bearer ${accessToken}`
            }
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw result;
        }

        dataBox.value =
          JSON.stringify(result, null, 2);

        statusText.textContent =
          'تم تحميل البيانات من Google Drive';
      } catch (error) {
        showError(error);
      }
    }

    function logout() {
      if (accessToken) {
        google.accounts.oauth2.revoke(
          accessToken,
          () => {
            accessToken = '';
            driveFileId = '';
            setDisconnected();
          }
        );
      }
    }

    loginButton.addEventListener('click', login);
    saveButton.addEventListener('click', saveToDrive);
    loadButton.addEventListener('click', loadFromDrive);
    logoutButton.addEventListener('click', logout);

    window.addEventListener('load', () => {
      setTimeout(initializeGoogle, 800);
    });
  </script>
</body>
</html>
